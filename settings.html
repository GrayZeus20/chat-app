<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Chat - Settings</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 md:bg-gray-50">
    <div class="h-dvh flex flex-col w-full max-w-2xl md:mx-auto md:my-0 md:h-[90vh] md:mt-[5vh] bg-white md:rounded-2xl md:shadow-xl md:shadow-gray-200/50 md:border md:border-gray-200/50 overflow-hidden">
        <div class="bg-blue-600 px-4 sm:px-5 py-3 sm:py-4 text-white flex justify-between items-center shrink-0">
            <a href="accounts.html" class="hover:bg-blue-500 rounded-lg p-2 transition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M19 12H5M12 19L5 12L12 5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </a>
            <span class="font-semibold text-base sm:text-lg">Account Settings</span>
            <div class="w-10"></div>
        </div>

        <div class="flex-1 overflow-y-auto px-4 sm:px-6 py-6">
            <div id="error-message" class="hidden bg-red-50 border border-red-200 text-red-600 text-sm px-4 py-3 rounded-lg mb-6 flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd"/></svg>
                <span id="error-text"></span>
            </div>
            <div id="success-message" class="hidden bg-green-50 border border-green-200 text-green-600 text-sm px-4 py-3 rounded-lg mb-6 flex items-center gap-2">
                <svg class="w-4 h-4 shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>
                <span id="success-text"></span>
            </div>

            <div class="flex items-center gap-4 mb-8 p-4 bg-gray-50 rounded-xl">
                <div id="profile-avatar" class="w-14 h-14 bg-blue-500 rounded-full flex items-center justify-center text-white text-xl font-bold shadow-sm">?</div>
                <div>
                    <div id="profile-name" class="font-semibold text-gray-900 text-lg">-</div>
                    <div id="profile-email" class="text-sm text-gray-500">-</div>
                </div>
            </div>

            <form id="settings-form" class="space-y-5">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
                    <input id="name" name="name" type="text" class="mt-1.5 block w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
                    <input id="email" name="email" type="email" class="mt-1.5 block w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>

                <hr class="border-gray-200">

                <div>
                    <label for="new-password" class="block text-sm font-medium text-gray-700">New Password <span class="text-gray-400 font-normal">(leave blank to keep current)</span></label>
                    <input id="new-password" name="newPassword" type="password" class="mt-1.5 block w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                </div>

                <hr class="border-gray-200">

                <div>
                    <label for="current-password" class="block text-sm font-medium text-gray-700">Current Password <span class="text-red-500">*</span></label>
                    <input id="current-password" name="currentPassword" type="password" required class="mt-1.5 block w-full rounded-xl border border-gray-200 px-4 py-2.5 text-sm text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition">
                    <p class="mt-1 text-xs text-gray-400">Required to save any changes</p>
                </div>

                <button type="submit" class="flex w-full justify-center rounded-xl bg-blue-600 px-3 py-2.5 text-sm font-semibold text-white shadow-md shadow-blue-200 hover:bg-blue-500 active:scale-[0.98] transition-all">Save Changes</button>
            </form>
        </div>
    </div>

    <script>
        async function loadProfile() {
            try {
                const res = await fetch('getProfile.php');
                const data = await res.json();
                if (data.status === 'success') {
                    const u = data.user;
                    const name = u.name.charAt(0).toUpperCase() + u.name.slice(1);
                    document.getElementById('profile-name').textContent = name;
                    document.getElementById('profile-email').textContent = u.email;
                    document.getElementById('profile-avatar').textContent = u.name.charAt(0).toUpperCase();
                    document.getElementById('name').value = u.name;
                    document.getElementById('email').value = u.email;
                }
            } catch (err) {
                window.location.href = 'login.html';
            }
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorEl = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const successEl = document.getElementById('success-message');
            const successText = document.getElementById('success-text');
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const currentPassword = document.getElementById('current-password').value;
            const newPassword = document.getElementById('new-password').value;

            if (!currentPassword) {
                errorText.textContent = 'Password saat ini wajib diisi';
                errorEl.classList.remove('hidden');
                return;
            }

            try {
                const res = await fetch('updateProfile.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, currentPassword, newPassword })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    successText.textContent = 'Profil berhasil diperbarui';
                    successEl.classList.remove('hidden');
                    document.getElementById('current-password').value = '';
                    document.getElementById('new-password').value = '';
                    loadProfile();
                } else {
                    errorText.textContent = data.message;
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorText.textContent = 'Kesalahan: ' + err.message;
                errorEl.classList.remove('hidden');
            }
        });

        loadProfile();
    </script>
</body>

</html>
