<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>App Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 md:bg-gray-50">
    <div class="h-dvh flex flex-col w-full max-w-2xl md:mx-auto md:my-0 md:h-[90vh] md:mt-[5vh] bg-white md:rounded-2xl md:shadow-xl md:shadow-gray-200/50 md:border md:border-gray-200/50 overflow-hidden">
        <div class="bg-blue-600 px-4 sm:px-5 py-3 sm:py-4 text-white flex items-center justify-center shrink-0 relative">
            <button id="settings-btn" class="absolute left-4 sm:left-5 hover:bg-blue-500 rounded-lg p-2 transition">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="12" cy="6" r="4" stroke="#ffffff" stroke-width="1.5"/>
                    <path d="M15 20.6151C14.0907 20.8619 13.0736 21 12 21C8.13401 21 5 19.2091 5 17C5 14.7909 8.13401 13 12 13C15.866 13 19 14.7909 19 17C19 17.3453 18.9234 17.6804 18.7795 18" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </button>
            <span class="font-semibold text-base sm:text-lg">Pesan</span>
        </div>

        <div id="settings-overlay" class="fixed inset-0 bg-black/40 z-20 hidden opacity-0 transition-opacity duration-200" onclick="closeSettings()"></div>

        <div id="settings-panel" class="fixed left-0 top-0 h-full w-72 bg-white z-30 shadow-2xl -translate-x-full transition-transform duration-200 ease-out">
            <div class="bg-blue-600 p-5 text-white">
                <div class="flex items-center gap-3">
                    <div id="settings-avatar" class="w-12 h-12 bg-white/20 rounded-full flex items-center justify-center text-xl font-bold">?</div>
                    <div class="min-w-0">
                        <div id="settings-name" class="font-semibold text-base truncate">-</div>
                        <div id="settings-email" class="text-sm text-white/70 truncate">-</div>
                    </div>
                </div>
            </div>
            <div class="p-3 space-y-1">
                <button onclick="window.location.href='settings.html'" class="flex items-center gap-3 w-full px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-100 rounded-lg transition">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                    Account Settings
                </button>
                <button onclick="window.location.href='chat.html'" class="flex items-center gap-3 w-full px-3 py-2.5 text-sm text-gray-700 hover:bg-gray-100 rounded-lg transition">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                    Open Chat
                </button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto bg-gray-50 md:bg-white" id="user-list"></div>
    </div>

    <script>
        const settingsBtn = document.getElementById('settings-btn');
        const settingsPanel = document.getElementById('settings-panel');
        const settingsOverlay = document.getElementById('settings-overlay');

        function openSettings() {
            settingsOverlay.classList.remove('hidden');
            requestAnimationFrame(() => {
                settingsOverlay.classList.remove('opacity-0');
                settingsPanel.classList.remove('-translate-x-full');
            });
        }

        function closeSettings() {
            settingsOverlay.classList.add('opacity-0');
            settingsPanel.classList.add('-translate-x-full');
            setTimeout(() => settingsOverlay.classList.add('hidden'), 200);
        }

        settingsBtn.addEventListener('click', openSettings);

        async function loadProfile() {
            try {
                const res = await fetch('getProfile.php');
                const data = await res.json();
                if (data.status === 'success') {
                    const u = data.user;
                    document.getElementById('settings-name').textContent = u.name.charAt(0).toUpperCase() + u.name.slice(1);
                    document.getElementById('settings-email').textContent = u.email;
                    document.getElementById('settings-avatar').textContent = u.name.charAt(0).toUpperCase();
                }
            } catch (err) {}
        }

        loadProfile();

        async function loadUsers() {
            try {
                const res = await fetch('getUsers.php');
                const data = await res.json();

                if (data.status === 'error') {
                    window.location.href = 'login.html';
                    return;
                }

                const container = document.getElementById('user-list');
                container.innerHTML = '';

                data.users.forEach((user, index) => {
                    const name = user.name.charAt(0).toUpperCase() + user.name.slice(1);
                    const initial = user.name.charAt(0).toUpperCase();
                    const colors = ['bg-blue-500', 'bg-green-500', 'bg-purple-500', 'bg-amber-500', 'bg-teal-500', 'bg-pink-500'];
                    const color = colors[index % colors.length];

                    const a = document.createElement('a');
                    a.href = 'chat.html?receiver_id=' + user.id;
                    a.className = 'flex items-center px-4 sm:px-5 py-3 sm:py-4 hover:bg-gray-100 active:bg-gray-200 transition border-b border-gray-100';

                    a.innerHTML = `
                        <div class="w-11 h-11 sm:w-12 sm:h-12 ${color} rounded-full flex items-center justify-center text-white font-semibold text-base sm:text-lg shrink-0 shadow-sm">
                            ${initial}
                        </div>
                        <div class="ml-3 sm:ml-4 flex-1 min-w-0">
                            <h2 class="text-[15px] font-semibold text-gray-900">${escapeHtml(name)}</h2>
                            <p class="text-sm text-gray-400 truncate">Tap to start chatting</p>
                        </div>
                        <svg class="w-5 h-5 text-gray-300 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
                        </svg>
                    `;

                    container.appendChild(a);
                });
            } catch (err) {
                window.location.href = 'login.html';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        loadUsers();
    </script>
</body>

</html>
