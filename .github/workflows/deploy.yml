name: Deploy to InfinityFree

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create env.php from secrets
        run: |
          echo "<?php" > env.php
          echo "define('DB_HOST', '${{ secrets.DB_HOST }}');" >> env.php
          echo "define('DB_USER', '${{ secrets.DB_USER }}');" >> env.php
          echo "define('DB_PASS', '${{ secrets.DB_PASS }}');" >> env.php
          echo "define('DB_NAME', '${{ secrets.DB_NAME }}');" >> env.php

      - name: Install Composer dependencies
        run: composer install --no-dev --no-interaction

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: /htdocs/
          delete-removed: true
          exclude: |
            **/.git*
            **/.git*/**
            database.sql
            .gitignore
            README.md
